<!DOCTYPE html>
<html lang="$lang$">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>$title$ — $subtitle$</title>
  <style>
    :root { color-scheme: light; --ink:#252622; --muted:#676a61; --accent:#8b332e; --paper:#faf8f2; }
    * { box-sizing: border-box; }
    html { scroll-padding-top: 2rem; }
    body { margin:0; background:var(--paper); color:var(--ink); font:19px/1.8 Georgia,"Songti SC","Noto Serif CJK SC",serif; }
    .book { max-width:48rem; margin:auto; padding:2rem 2.5rem 6rem; }
    .title-page { padding:5rem 0 4rem; border-bottom:1px solid #d5d4ca; margin-bottom:3rem; }
    .eyebrow,.date,summary,.return-link { font-family:system-ui,sans-serif; font-size:.78rem; color:var(--muted); letter-spacing:.03em; }
    .eyebrow { color:var(--accent); border-top:3px solid var(--accent); padding-top:1rem; display:inline-block; }
    .title-page h1 { font-size:clamp(2.7rem,7vw,4.3rem); line-height:1.15; letter-spacing:-.035em; margin:1.5rem 0 1rem; }
    .subtitle { font-size:1.3rem; line-height:1.6; max-width:36rem; }
    .date { margin-top:2rem; }
    details { border-block:1px solid #d5d4ca; padding:1rem 0; margin-bottom:4rem; }
    summary { cursor:pointer; color:var(--ink); font-size:.9rem; }
    nav ul { padding-left:1.4rem; }
    nav li { padding:.2rem 0; line-height:1.5; font-size:.95rem; }
    nav a { text-decoration:none; }
    h1,h2,h3 { font-weight:500; line-height:1.4; text-wrap:balance; }
    main h1 { font-size:2rem; padding-top:2rem; margin-top:4rem; border-top:1px solid #d5d4ca; }
    h2 { margin:2.5rem 0 1rem; font-size:1.4rem; }
    h3 { margin-top:2rem; font-size:1.1rem; }
    p { margin:0 0 1.2rem; }
    a { color:var(--accent); text-underline-offset:.18em; overflow-wrap:anywhere; }
    a:focus-visible,summary:focus-visible { outline:3px solid #8b332e; outline-offset:4px; }
    a.citation { font:0.7em/1 system-ui,sans-serif; vertical-align:super; padding:0 .12em; text-decoration:none; }
    strong { font-weight:700; }
    hr { border:0; border-top:1px solid #deded5; margin:2rem 0; }
    blockquote { border-left:3px solid #c6c6ba; margin:1.5rem 0; padding-left:1.3rem; color:#454840; }
    table { border-collapse:collapse; width:100%; display:block; overflow-x:auto; font-size:.87rem; line-height:1.6; margin:1.5rem 0; }
    th,td { padding:.75rem .65rem; text-align:left; vertical-align:top; border-bottom:1px solid #d5d4ca; min-width:5rem; }
    th { font-family:system-ui,sans-serif; font-size:.75rem; }
    #notes { font-size:1rem; line-height:1.75; }
    #notes h3 { color:var(--muted); font-family:system-ui,sans-serif; font-size:.85rem; }
    :target { scroll-margin-top:2rem; }
    @media(max-width:600px) {
      .book { padding:1rem 1.25rem 4rem; } body { font-size:18px; }
      .title-page { padding:3rem 0; } main h1 { font-size:1.7rem; }
      table,tbody,tr,td { display:block; } thead { display:none; }
      tr { padding:.85rem 0; border-bottom:1px solid #d5d4ca; }
      td { min-width:0; padding:.15rem 0; border:0; }
      td:first-child { font-family:system-ui,sans-serif; color:var(--muted); font-size:.72rem; }
      td:nth-child(2) { font-weight:bold; }
    }
    @media print { body { background:white; font-size:11pt; } .book { max-width:none; padding:0; } .title-page,main h1 { break-before:page; } details { display:none; } a { color:inherit; } table { display:table; } }
  </style>
</head>
<body>
  <div class="book">
    <header class="title-page">
      <p class="eyebrow">$edition$</p>
      <h1>$title$</h1>
      <p class="subtitle">$subtitle$</p>
      <p class="date">$date$</p>
    </header>
    <details id="contents" open>
      <summary>$toc-title$</summary>
      <nav aria-label="$toc-title$">$toc$</nav>
    </details>
    <main>$body$</main>
  </div>
</body>
</html>
