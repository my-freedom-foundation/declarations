name: Publish the book

on:
  push:
    branches: [main]
    paths: ["book/**", "mainland-china-liberty/**", ".github/workflows/pages.yml"]
  pull_request:
    paths: ["book/**", "mainland-china-liberty/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install the book converter
        run: sudo apt-get update && sudo apt-get install -y pandoc
      - name: Check Python syntax
        run: python -m compileall -q book/site
      - name: Test citation and URL handling
        run: python -m unittest discover -s book/site -p 'test_*.py'
      - name: Build both editions
        run: python book/site/build.py
      - name: Validate all generated links and downloads
        run: python book/site/validate.py _site
      - name: Upload the website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
